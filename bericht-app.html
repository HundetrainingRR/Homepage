<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Bericht erstellen – Trainerbericht</title>

    <!-- Falls dein Homepage-Projekt Bootstrap lokal enthält, hier den lokalen Pfad eintragen -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Gleiche Variablen wie auf der Login-Seite: Änderungen an beiden Stellen vornehmen */
        :root {
            --farbe-text: #1a1a1a;
            --farbe-hintergrund: #ffffff;
            --farbe-flaeche: #f5f5f3;
            --farbe-akzent: #1a1a1a;
            --farbe-akzent-hover: #3a3a3a;
            --farbe-linie: #d4d4d0;
            --farbe-fehler: #a4262c;
            --farbe-erfolg: #2f6b3f;
            --schrift: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: var(--schrift);
            color: var(--farbe-text);
            background: var(--farbe-hintergrund);
            display: flex;
            flex-direction: column;
        }

        header.leiste {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--farbe-linie);
        }

        header.leiste img { height: 2.75rem; width: auto; }
        header.leiste .nutzer { font-size: 0.9rem; color: #5c5c58; text-align: right; }

        main {
            flex: 1;
            width: 100%;
            max-width: 34rem;
            margin: 0 auto;
            padding: 2.5rem 1.25rem;
        }

        h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 0.5rem; }
        p.einleitung { color: #5c5c58; line-height: 1.5; margin-bottom: 2rem; }

        label { font-size: 0.9rem; font-weight: 500; margin-bottom: 0.35rem; }

        .form-control {
            border: 1px solid var(--farbe-linie);
            border-radius: 0.25rem;
            background: var(--farbe-flaeche);
            padding: 0.7rem 0.85rem;
        }

        .form-control:focus {
            background: var(--farbe-hintergrund);
            border-color: var(--farbe-akzent);
            box-shadow: 0 0 0 0.2rem rgba(26, 26, 26, 0.15);
        }

        .hinweis { font-size: 0.85rem; color: #5c5c58; margin-top: 0.5rem; }

        .btn-haupt, .btn-download {
            display: block;
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--farbe-akzent);
            border-radius: 0.25rem;
            background: var(--farbe-akzent);
            color: #fff;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            margin-top: 1.25rem;
        }

        .btn-haupt:hover:not(:disabled), .btn-download:hover { background: var(--farbe-akzent-hover); color: #fff; }
        .btn-haupt:focus-visible, .btn-download:focus-visible,
        .link-schlicht:focus-visible { outline: 3px solid rgba(26, 26, 26, 0.35); outline-offset: 2px; }
        .btn-haupt:disabled { opacity: 0.6; cursor: wait; }

        .btn-zweit {
            background: var(--farbe-hintergrund);
            color: var(--farbe-akzent);
        }

        .btn-zweit:hover { background: var(--farbe-flaeche); color: var(--farbe-akzent); }

        .link-schlicht {
            background: none;
            border: 0;
            padding: 0;
            color: var(--farbe-text);
            text-decoration: underline;
            text-underline-offset: 0.2em;
            font-size: 0.9rem;
            cursor: pointer;
        }

        #meldung { min-height: 1.5rem; margin-top: 1.25rem; font-size: 0.95rem; }
        #meldung.fehler { color: var(--farbe-fehler); }

        .laufend { display: flex; align-items: center; gap: 0.75rem; }
        .laufend .spinner-border { width: 1.25rem; height: 1.25rem; border-width: 0.15em; }

        #ergebnis h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.25rem; }
        #ergebnis .gruen { color: var(--farbe-erfolg); }

        [hidden] { display: none !important; }

        footer { padding: 1.25rem; text-align: center; font-size: 0.85rem; }
        footer a { color: #5c5c58; margin: 0 0.6rem; }
    </style>
</head>
<body>

<header class="leiste">
    <img src="assets/img/Elegant%20Monogram%20Logo%20Minimalist%20Schwarz.png"
         alt="Logo mit zwei R Buchstaben und dem Wort Hundetraining">
    <div class="nutzer">
        <div id="nutzer-email"></div>
        <button type="button" class="link-schlicht" id="abmelden">Abmelden</button>
    </div>
</header>

<main>
    <h1>Bericht erstellen</h1>
    <p class="einleitung">
        Lade deine Sprachmemo hoch. Du bekommst den Trainerbericht und die Kundenzusammenfassung als Word-Dokumente.
    </p>

    <section id="eingabe">
        <form id="upload-formular" novalidate>
            <label for="aufnahme" class="form-label">Sprachmemo</label>
            <input type="file" class="form-control" id="aufnahme" name="aufnahme"
                   accept=".m4a,.mp3,.mp4,.wav,.ogg,.webm,.flac,.mpeg,.mpga,audio/*">
            <p class="hinweis">Erlaubt sind m4a, mp3, mp4, wav, ogg, webm und flac bis 25 MB.</p>

            <button type="submit" class="btn-haupt" id="start">Bericht erstellen</button>
        </form>
    </section>

    <section id="laeuft" hidden>
        <div class="laufend" role="status">
            <div class="spinner-border" aria-hidden="true"></div>
            <span>Deine Aufnahme wird verarbeitet. Das dauert etwa eine halbe Minute.</span>
        </div>
    </section>

    <section id="ergebnis" hidden>
        <h2><span class="gruen">Fertig.</span> Deine Dokumente</h2>
        <div id="downloads"></div>
        <button type="button" class="btn-haupt btn-zweit" id="neu">Neue Aufnahme</button>
    </section>

    <div id="meldung" role="alert" aria-live="polite"></div>
</main>

<footer>
    <a href="Impressum.html">Impressum</a>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* --- Dieselben Firebase-Werte wie in bericht-login.html --- */
    const firebaseConfig = {
        apiKey: "AIzaSyDAzyf9nsuR-9o_Ru-YbpaTHKMPQrMm9uE",
        authDomain: "trainerbericht.firebaseapp.com",
  projectId: "trainerbericht",
        appId: "1:385161830028:web:5396425581c89d0f98e5a9"
    };

    /* --- Adresse des Backends: lokal zum Testen, später die Cloud-Run-Adresse --- */


    const API_URL = location.hostname === "localhost"
        ? "http://localhost:8000"
        : "https://trainerbericht-api-385161830028.europe-west3.run.app";

    const LOGIN_SEITE = "bericht-login.html";
    const MAX_BYTES = 25 * 1024 * 1024;
    const DOCX_TYP = "application/vnd.openxmlformats-officedocument.wordprocessingml.document";
    const BESCHRIFTUNG = {
        trainerbericht: "Trainerbericht herunterladen",
        kundenzusammenfassung: "Kundenzusammenfassung herunterladen"
    };

    const auth = getAuth(initializeApp(firebaseConfig));

    const el = (id) => document.getElementById(id);
    const abschnitte = { eingabe: el("eingabe"), laeuft: el("laeuft"), ergebnis: el("ergebnis") };
    const meldung = el("meldung");
    let aktuelleLinks = [];

    function zeige(name) {
        for (const [schluessel, element] of Object.entries(abschnitte)) {
            element.hidden = schluessel !== name;
        }
    }

    function zeigeFehler(text) {
        meldung.textContent = text;
        meldung.className = text ? "fehler" : "";
    }

    function base64ZuBlob(base64, typ) {
        const binaer = atob(base64);
        const bytes = new Uint8Array(binaer.length);
        for (let i = 0; i < binaer.length; i++) bytes[i] = binaer.charCodeAt(i);
        return new Blob([bytes], { type: typ });
    }

    function aufraeumen() {
        aktuelleLinks.forEach((url) => URL.revokeObjectURL(url));
        aktuelleLinks = [];
        el("downloads").replaceChildren();
    }

    function zeigeDownloads(dateien) {
        aufraeumen();
        for (const datei of dateien) {
            const url = URL.createObjectURL(base64ZuBlob(datei.inhalt, DOCX_TYP));
            aktuelleLinks.push(url);
            const link = document.createElement("a");
            link.className = "btn-download";
            link.href = url;
            link.download = datei.name;
            link.textContent = BESCHRIFTUNG[datei.art] || datei.name;
            el("downloads").appendChild(link);
        }
        zeige("ergebnis");
    }

    onAuthStateChanged(auth, (nutzer) => {
        if (!nutzer) {
            window.location.replace(LOGIN_SEITE);
            return;
        }
        el("nutzer-email").textContent = nutzer.email;
    });

    el("abmelden").addEventListener("click", async () => {
        await signOut(auth);
        window.location.replace(LOGIN_SEITE);
    });

    el("neu").addEventListener("click", () => {
        aufraeumen();
        el("upload-formular").reset();
        zeigeFehler("");
        zeige("eingabe");
    });

    el("upload-formular").addEventListener("submit", async (ereignis) => {
        ereignis.preventDefault();
        zeigeFehler("");

        const datei = el("aufnahme").files[0];
        if (!datei) {
            zeigeFehler("Bitte wähle zuerst eine Aufnahme aus.");
            return;
        }
        if (datei.size > MAX_BYTES) {
            zeigeFehler("Die Datei ist größer als 25 MB.");
            return;
        }

        const nutzer = auth.currentUser;
        if (!nutzer) {
            window.location.replace(LOGIN_SEITE);
            return;
        }

        zeige("laeuft");

        try {
            const token = await nutzer.getIdToken();
            const daten = new FormData();
            daten.append("audio", datei);

            const antwort = await fetch(`${API_URL}/berichte`, {
                method: "POST",
                headers: { Authorization: `Bearer ${token}` },
                body: daten
            });

            if (antwort.status === 401) {
                window.location.replace(LOGIN_SEITE);
                return;
            }
            if (!antwort.ok) {
                let grund = "Die Verarbeitung hat nicht geklappt. Bitte versuche es erneut.";
                try {
                    const fehler = await antwort.json();
                    if (fehler.detail) grund = fehler.detail;
                } catch (_) { /* Antwort war kein JSON */ }
                throw new Error(grund);
            }

            const ergebnis = await antwort.json();
            zeigeDownloads(ergebnis.dateien);
        } catch (fehler) {
            const netz = fehler instanceof TypeError;
            zeigeFehler(netz
                ? "Keine Verbindung zum Server. Prüfe dein Netz und versuche es erneut."
                : fehler.message);
            zeige("eingabe");
        }
    });
</script>

</body>
</html>
