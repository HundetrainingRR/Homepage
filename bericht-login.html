<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Die Seite soll nicht in Suchmaschinen auftauchen -->
    <meta name="robots" content="noindex, nofollow">
    <title>Anmelden – Trainerbericht</title>

    <!--
        Bootstrap: Falls dein Homepage-Projekt Bootstrap schon lokal enthält,
        ersetze diesen Link durch den lokalen Pfad (gleiche Zeile wie in deinen anderen Seiten).
    -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Farben und Schrift hier an die Homepage anpassen */
        :root {
            --farbe-text: #1a1a1a;
            --farbe-hintergrund: #ffffff;
            --farbe-flaeche: #f5f5f3;
            --farbe-akzent: #1a1a1a;
            --farbe-akzent-hover: #3a3a3a;
            --farbe-linie: #d4d4d0;
            --farbe-fehler: #a4262c;
            --farbe-erfolg: #2f6b3f;
            --schrift: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: var(--schrift);
            color: var(--farbe-text);
            background: var(--farbe-hintergrund);
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.25rem;
        }

        .login {
            width: 100%;
            max-width: 22rem;
            text-align: center;
        }

        .login img.logo {
            width: 9rem;
            max-width: 60%;
            height: auto;
            margin-bottom: 1.75rem;
        }

        .login h1 {
            font-size: 1.75rem;
            font-weight: 600;
            letter-spacing: 0.01em;
            margin-bottom: 0.5rem;
        }

        .login p.einleitung {
            color: #5c5c58;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .login form { text-align: left; }

        .login label {
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.35rem;
        }

        .login .form-control {
            border: 1px solid var(--farbe-linie);
            border-radius: 0.25rem;
            background: var(--farbe-flaeche);
            padding: 0.7rem 0.85rem;
            color: var(--farbe-text);
        }

        .login .form-control:focus {
            background: var(--farbe-hintergrund);
            border-color: var(--farbe-akzent);
            box-shadow: 0 0 0 0.2rem rgba(26, 26, 26, 0.15);
        }

        .btn-anmelden {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--farbe-akzent);
            border-radius: 0.25rem;
            background: var(--farbe-akzent);
            color: #fff;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .btn-anmelden:hover:not(:disabled) { background: var(--farbe-akzent-hover); }
        .btn-anmelden:focus-visible { outline: 3px solid rgba(26, 26, 26, 0.35); outline-offset: 2px; }
        .btn-anmelden:disabled { opacity: 0.6; cursor: wait; }

        .link-schlicht {
            background: none;
            border: 0;
            padding: 0;
            color: var(--farbe-text);
            text-decoration: underline;
            text-underline-offset: 0.2em;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .link-schlicht:focus-visible { outline: 3px solid rgba(26, 26, 26, 0.35); outline-offset: 2px; }

        #meldung {
            min-height: 1.5rem;
            font-size: 0.95rem;
            margin: 1rem 0 0.25rem;
        }

        #meldung.fehler { color: var(--farbe-fehler); }
        #meldung.erfolg { color: var(--farbe-erfolg); }

        footer {
            padding: 1.25rem;
            text-align: center;
            font-size: 0.85rem;
        }

        footer a { color: #5c5c58; margin: 0 0.6rem; }
    </style>
</head>
<body>

<main>
    <div class="login">
        <img class="logo"
             src="assets/img/Elegant%20Monogram%20Logo%20Minimalist%20Schwarz.png"
             alt="Logo mit zwei R Buchstaben und dem Wort Hundetraining">

        <h1>Trainerbericht</h1>
        <p class="einleitung">Melde dich an, um eine Aufnahme hochzuladen und deine Berichte zu erstellen.</p>

        <form id="login-formular" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label">E-Mail-Adresse</label>
                <input type="email" class="form-control" id="email" name="email"
                       autocomplete="username" required>
            </div>

            <div class="mb-2">
                <label for="passwort" class="form-label">Passwort</label>
                <input type="password" class="form-control" id="passwort" name="passwort"
                       autocomplete="current-password" required>
            </div>

            <div class="text-end mb-1">
                <button type="button" class="link-schlicht" id="passwort-vergessen">Passwort vergessen?</button>
            </div>

            <div id="meldung" role="alert" aria-live="polite"></div>

            <button type="submit" class="btn-anmelden" id="anmelden">Anmelden</button>
        </form>
    </div>
</main>

<footer>
    <a href="Impressum.html">Impressum</a>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* --- 1. Hier die Werte aus deinem Firebase-Projekt eintragen --- */
    /* Firebase-Konsole -> Projekteinstellungen -> Allgemein -> Deine Apps -> Web-App -> Konfiguration */
    const firebaseConfig = {
        apiKey: "DEIN_API_KEY",
        authDomain: "DEIN_PROJEKT.firebaseapp.com",
        projectId: "DEIN_PROJEKT",
        appId: "DEINE_APP_ID"
    };

    /* --- 2. Seite, die nach erfolgreicher Anmeldung geöffnet wird --- */
    const ZIELSEITE = "bericht-app.html";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const formular = document.getElementById("login-formular");
    const emailFeld = document.getElementById("email");
    const passwortFeld = document.getElementById("passwort");
    const knopf = document.getElementById("anmelden");
    const meldung = document.getElementById("meldung");

    function zeigeMeldung(text, art) {
        meldung.textContent = text;
        meldung.className = art || "";
    }

    function fehlertext(code) {
        switch (code) {
            case "auth/invalid-email":
                return "Die E-Mail-Adresse ist ungültig.";
            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":
                return "E-Mail-Adresse oder Passwort stimmen nicht.";
            case "auth/user-disabled":
                return "Dieses Konto ist gesperrt.";
            case "auth/too-many-requests":
                return "Zu viele Versuche. Bitte warte einige Minuten und versuche es erneut.";
            case "auth/network-request-failed":
                return "Keine Verbindung. Prüfe dein Netz und versuche es erneut.";
            default:
                return "Die Anmeldung hat nicht geklappt. Bitte versuche es erneut.";
        }
    }

    /* Wer schon angemeldet ist, kommt direkt weiter */
    onAuthStateChanged(auth, (nutzer) => {
        if (nutzer) {
            window.location.replace(ZIELSEITE);
        }
    });

    formular.addEventListener("submit", async (ereignis) => {
        ereignis.preventDefault();
        zeigeMeldung("");

        const email = emailFeld.value.trim();
        const passwort = passwortFeld.value;

        if (!email || !passwort) {
            zeigeMeldung("Bitte E-Mail-Adresse und Passwort eintragen.", "fehler");
            return;
        }

        knopf.disabled = true;
        knopf.textContent = "Anmelden …";

        try {
            await signInWithEmailAndPassword(auth, email, passwort);
            /* Die Weiterleitung übernimmt onAuthStateChanged */
        } catch (fehler) {
            zeigeMeldung(fehlertext(fehler.code), "fehler");
            knopf.disabled = false;
            knopf.textContent = "Anmelden";
        }
    });

    document.getElementById("passwort-vergessen").addEventListener("click", async () => {
        const email = emailFeld.value.trim();
        if (!email) {
            zeigeMeldung("Trage zuerst deine E-Mail-Adresse ein.", "fehler");
            emailFeld.focus();
            return;
        }
        try {
            await sendPasswordResetEmail(auth, email);
        } catch (fehler) {
            if (fehler.code === "auth/invalid-email") {
                zeigeMeldung(fehlertext(fehler.code), "fehler");
                return;
            }
            /* Andere Fehler bewusst nicht anzeigen, damit niemand erfährt, welche Adressen existieren */
        }
        zeigeMeldung("Wenn zu dieser Adresse ein Konto besteht, haben wir eine E-Mail zum Zurücksetzen gesendet.", "erfolg");
    });
</script>

</body>
</html>
