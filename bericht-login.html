<!DOCTYPE html>
<html data-bs-theme="light" lang="de">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Anmelden – Trainerbericht</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Alef&amp;display=swap">
    <link rel="stylesheet" href="assets/css/bss-overrides.css">
    <link rel="stylesheet" href="assets/css/Navbar-Centered-Links-icons.css">
    <link rel="stylesheet" href="assets/css/Projects-Grid-Horizontal-images.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <main>
        <div class="login"><img class="logo" src="assets/img/Elegant%20Monogram%20Logo%20Minimalist%20Schwarz.png" alt="Logo mit zwei R Buchstaben und dem Wort Hundetraining">
            <h1>Trainerbericht</h1>
            <p class="einleitung">Melde dich an, um eine Aufnahme hochzuladen und deine Berichte zu erstellen.</p>
            <form id="login-formular" novalidate="">
                <div class="mb-3"><label class="form-label" for="email">E-Mail-Adresse</label><input class="form-control" type="email" autocomplete="username" id="email" name="email" required=""></div>
                <div class="mb-2"><label class="form-label" for="passwort">Passwort</label><input class="form-control" type="password" autocomplete="current-password" id="passwort" name="passwort" required=""></div>
                <div class="text-end mb-1"><button type="button" class="link-schlicht" id="passwort-vergessen">Passwort vergessen?</button></div>
                <div id="meldung" role="alert" aria-live="polite"></div><button type="submit" class="btn-anmelden" id="anmelden">Anmelden</button>
            </form>
        </div>
    </main>
    <footer><a href="Impressum.html">Impressum</a></footer><script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
        getAuth,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    /* --- 1. Hier die Werte aus deinem Firebase-Projekt eintragen --- */
    /* Firebase-Konsole -> Projekteinstellungen -> Allgemein -> Deine Apps -> Web-App -> Konfiguration */
    const firebaseConfig = {
        apiKey: "DEIN_API_KEY",
        authDomain: "DEIN_PROJEKT.firebaseapp.com",
        projectId: "DEIN_PROJEKT",
        appId: "DEINE_APP_ID"
    };

    /* --- 2. Seite, die nach erfolgreicher Anmeldung geöffnet wird --- */
    const ZIELSEITE = "bericht-app.html";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const formular = document.getElementById("login-formular");
    const emailFeld = document.getElementById("email");
    const passwortFeld = document.getElementById("passwort");
    const knopf = document.getElementById("anmelden");
    const meldung = document.getElementById("meldung");

    function zeigeMeldung(text, art) {
        meldung.textContent = text;
        meldung.className = art || "";
    }

    function fehlertext(code) {
        switch (code) {
            case "auth/invalid-email":
                return "Die E-Mail-Adresse ist ungültig.";
            case "auth/invalid-credential":
            case "auth/wrong-password":
            case "auth/user-not-found":
                return "E-Mail-Adresse oder Passwort stimmen nicht.";
            case "auth/user-disabled":
                return "Dieses Konto ist gesperrt.";
            case "auth/too-many-requests":
                return "Zu viele Versuche. Bitte warte einige Minuten und versuche es erneut.";
            case "auth/network-request-failed":
                return "Keine Verbindung. Prüfe dein Netz und versuche es erneut.";
            default:
                return "Die Anmeldung hat nicht geklappt. Bitte versuche es erneut.";
        }
    }

    /* Wer schon angemeldet ist, kommt direkt weiter */
    onAuthStateChanged(auth, (nutzer) => {
        if (nutzer) {
            window.location.replace(ZIELSEITE);
        }
    });

    formular.addEventListener("submit", async (ereignis) => {
        ereignis.preventDefault();
        zeigeMeldung("");

        const email = emailFeld.value.trim();
        const passwort = passwortFeld.value;

        if (!email || !passwort) {
            zeigeMeldung("Bitte E-Mail-Adresse und Passwort eintragen.", "fehler");
            return;
        }

        knopf.disabled = true;
        knopf.textContent = "Anmelden …";

        try {
            await signInWithEmailAndPassword(auth, email, passwort);
            /* Die Weiterleitung übernimmt onAuthStateChanged */
        } catch (fehler) {
            zeigeMeldung(fehlertext(fehler.code), "fehler");
            knopf.disabled = false;
            knopf.textContent = "Anmelden";
        }
    });

    document.getElementById("passwort-vergessen").addEventListener("click", async () => {
        const email = emailFeld.value.trim();
        if (!email) {
            zeigeMeldung("Trage zuerst deine E-Mail-Adresse ein.", "fehler");
            emailFeld.focus();
            return;
        }
        try {
            await sendPasswordResetEmail(auth, email);
        } catch (fehler) {
            if (fehler.code === "auth/invalid-email") {
                zeigeMeldung(fehlertext(fehler.code), "fehler");
                return;
            }
            /* Andere Fehler bewusst nicht anzeigen, damit niemand erfährt, welche Adressen existieren */
        }
        zeigeMeldung("Wenn zu dieser Adresse ein Konto besteht, haben wir eine E-Mail zum Zurücksetzen gesendet.", "erfolg");
    });
</script>
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/bs-init.js"></script>
</body>

</html>
